# Derived from ZFTurbo/Music-Source-Separation-Training @ 83d495d
# configs/config_musdb18_scnet_large.yaml — the SCNet-large ("XL") architecture matching the
# pinned checkpoint model_scnet_ep_54_sdr_9.8051.ckpt. Only the audio / model / inference
# sections are kept: this is the vendored INFERENCE path, and the upstream training +
# augmentations blocks are both unnecessary here and carry a `!!python/tuple` tag the safe
# YAML loader rejects. training.use_amp is preserved (inference reads it for autocast).
audio:
  chunk_size: 485100 # 44100 * 11
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  sources:
    - drums
    - bass
    - other
    - vocals
  audio_channels: 2
  dims:
    - 4
    - 64
    - 128
    - 256
  nfft: 4096
  hop_size: 1024
  win_size: 4096
  normalized: True
  band_SR:
    - 0.225
    - 0.372
    - 0.403
  band_stride:
    - 1
    - 4
    - 16
  band_kernel:
    - 3
    - 4
    - 16
  conv_depths:
    - 3
    - 2
    - 1
  compress: 4
  conv_kernel: 3
  num_dplayer: 8 # SCNet-XL: the ep_54_sdr_9.8051 checkpoint has 8 dual-path layers (upstream
                 # "large" config ships 6; the shipped XL checkpoint state_dict has dp_modules.0-7)
  expand: 1

training:
  use_amp: true # inference reads this for mixed-precision autocast

inference:
  batch_size: 8
  dim_t: 256
  num_overlap: 4
  normalize: false
