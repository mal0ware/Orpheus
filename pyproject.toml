[project]
name = "orpheus-mcp"
version = "0.1.0.dev0"
description = "An MCP server that lets an AI agent analyze, explain, and reshape music inside the REAPER DAW."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mal0ss", email = "mal0ss.network@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "reaper", "daw", "music", "ai", "agent", "reascript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Artistic Software",
]

dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.7",
    "music21>=9.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    # Matchering (GPL-3.0) is deliberately NOT a dependency of this MIT package. It returns as
    # an optional [master] extra only when apply_master_match is built (spec 2026-10-23 §3).
]

[project.optional-dependencies]
analysis = [
    "librosa>=0.10",
    "torch>=2.4",              # CPU wheel via the explicit pytorch-cpu index below (analysis
                               # extra); [separation] overrides to pytorch-cu124 instead
    "panns-inference>=0.1.1",
]
separation = [
    # audio-separator is NOT here: every version of it caps fastmcp<3.4 transitively.
    # It runs in an isolated uv env (D9, same pattern as basic-pitch) via its CLI.
    "librosa>=0.10",
    "panns-inference>=0.1.1",
    "torch>=2.4", "torchaudio>=2.4",
    "faster-whisper>=1.0",
    "whisperx>=3.1",           # NOTE (§14.1): the lib may pull pyannote as a dep — acceptable;
                               # what must NEVER happen is calling diarization or fetching its
                               # HF-gated models. Pin run 0.3 verifies install needs no account.
    "stable-ts>=2.17",         # pinned fallback aligner (§14.1)
    "einops>=0.8", "omegaconf>=2.3",   # required by vendored MSST at runtime (pin runs complete)
    "setuptools<81",           # ctranslate2 (a faster-whisper dep) still does `import
                               # pkg_resources` at import time; setuptools 81 dropped it
                               # (removed entirely in 83, see infra fix wave 1). Pin until
                               # ctranslate2 ships a pkg_resources-free release.
]
transcribe = ["basic-pitch>=0.3"]      # NOTE: installed only in the isolated ≤3.11 env (Task 0.5)
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "lupa>=2.0",     # runs the Lua-side handler suites in-process (scripts/run_lua_tests.py)
]

[project.urls]
Homepage = "https://github.com/mal0ware/Orpheus"
Repository = "https://github.com/mal0ware/Orpheus"
Issues = "https://github.com/mal0ware/Orpheus/issues"

[project.scripts]
orpheus-mcp = "orpheus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orpheus_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/orpheus_mcp/bridge/lua" = "orpheus_mcp/bridge/lua"
"data" = "orpheus_mcp/data"
# Vendored MSST SCNet ships its runtime config + upstream LICENSE (non-.py, not auto-included).
"src/orpheus_mcp/_vendor/msst/config_scnet_large.yaml" = "orpheus_mcp/_vendor/msst/config_scnet_large.yaml"
"src/orpheus_mcp/_vendor/msst/LICENSE" = "orpheus_mcp/_vendor/msst/LICENSE"
# Vendored BTC-ISMIR19 chord model ships its upstream LICENSE (non-.py, not auto-included).
"src/orpheus_mcp/_vendor/btc/LICENSE" = "orpheus_mcp/_vendor/btc/LICENSE"

[tool.uv]
# Without this, the resolver picks numpy 2.5 and then backtracks numba all the way to
# 0.53.1 (the only version with no numpy upper bound) — a source-only release whose
# llvmlite 0.36 build requires Python <3.10 and fails on this machine's 3.12.
# Forcing a modern numba pulls a numpy both it and everything else agrees on.
constraint-dependencies = ["numba>=0.60", "llvmlite>=0.43"]

# extras are conflict-partitioned so uv forks the torch resolution per extra;
# `separation` therefore supersets `analysis` instead of referencing it.
conflicts = [[{ extra = "analysis" }, { extra = "separation" }]]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch      = [{ index = "pytorch-cpu", extra = "analysis" }, { index = "pytorch-cu124", extra = "separation" }]
torchaudio = [{ index = "pytorch-cu124", extra = "separation" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored upstream MSST model code (scnet.py / separation.py) is verbatim third-party and
# not held to our lint rules; our own inference.py in the same dir IS linted (see per-file below).
extend-exclude = [
    "src/orpheus_mcp/_vendor/msst/scnet.py",
    "src/orpheus_mcp/_vendor/msst/separation.py",
    # Vendored BTC-ISMIR19 model code (verbatim upstream, one numpy-2 fix) — not held to our lint.
    "src/orpheus_mcp/_vendor/btc/btc_model.py",
    "src/orpheus_mcp/_vendor/btc/transformer_modules.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "desktop: needs pinned checkpoints / the desktop box (deselect in CI)",
    "gpu: needs CUDA",
]

[tool.mypy]
python_version = "3.11"
packages = ["orpheus_mcp"]
ignore_missing_imports = true

# Vendored upstream MSST code is untyped third-party; do not hold it to our type gate.
[[tool.mypy.overrides]]
module = "orpheus_mcp._vendor.*"
ignore_errors = true
