name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install (with dev + analysis extras)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      # The Lua half of the bridge contract, in-process via lupa (no lua interpreter
      # on the runner) — same mechanism the dev-log verified it with.
      - name: Lua handler suites (via lupa)
        run: uv run python scripts/run_lua_tests.py

  analysis-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install (with analysis + dev extras)
        run: uv sync --extra analysis --extra dev

      - name: Test (excluding desktop and gpu)
        run: uv run pytest -q -m "not desktop and not gpu"
